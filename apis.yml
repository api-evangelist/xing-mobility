aid: xing-mobility
name: XING Mobility
description: >-
  XING Mobility (行競科技) is a Taiwan-based battery technology company building
  immersion-cooled lithium battery systems under the IMMERSIO brand, including
  cell-to-pack (CTP) battery platforms, battery backup units (BBU) for AI data
  centers, and the automotive-grade XBE energy storage series, serving electric
  mobility, energy storage (ESS), marine, and data center markets from its
  Taoyuan City headquarters. A 500 Global portfolio company, XING Mobility
  publishes no public developer API or API documentation as of July 2026.
